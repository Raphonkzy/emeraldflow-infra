name: Terraform Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    env:
      AWS_CREDS_AVAILABLE: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS Credentials
        if: env.AWS_CREDS_AVAILABLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init (with backend)
        if: env.AWS_CREDS_AVAILABLE == 'true'
        run: terraform init

      - name: Terraform Init (without backend)
        if: env.AWS_CREDS_AVAILABLE != 'true'
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: env.AWS_CREDS_AVAILABLE == 'true'
        run: terraform plan -no-color

      - name: Skip Terraform Plan (missing AWS secrets)
        if: env.AWS_CREDS_AVAILABLE != 'true'
        run: echo "AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY not set; skipped terraform plan."

  apply:
    name: Terraform Apply
    needs: validate-and-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Send Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Pipeline Status: ${{ job.status }}"
          SLACK_MESSAGE: "Workflow ${{ github.workflow }} in ${{ github.repository }} finished with status: ${{ job.status }}."
